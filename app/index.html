<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bear Family Tree</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<!-- pinned to one exact version; the browser refuses any other file (it shares aizattaha.github.io with BearHaus) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js" integrity="sha384-BWcjm9OdFth9TbhCxZPdm+gAOUMAzQy9nmTs12ioXdCcbVnJaPMn+fMUoQCLt60R" crossorigin="anonymous"></script>
<style>
:root{
  --primary:#004A98; --primary-hover:#003A78; --accent:#B4CEFF; --accent-soft:#E4EEFF;
  --canvas:#FFFFFF; --muted:#E6E5E5; --field:#F7F9FC; --ink:#1A2B44; --ink-soft:#55657D;
  --shadow-soft:0 2px 12px rgba(0,74,152,.06);
  --shadow-lift:0 8px 28px rgba(0,74,152,.12);
  --shadow-hero:0 24px 64px rgba(0,74,152,.22), 0 4px 16px rgba(0,74,152,.10);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{font-family:Poppins,Futura,"Century Gothic",-apple-system,sans-serif;background:var(--field);
  color:var(--ink);font-size:15px;line-height:24px;overflow:hidden;
  touch-action:manipulation;-webkit-text-size-adjust:100%;} /* pinch-zoom the page anywhere but the tree — the tree has its own */
button{font:inherit;border:0;background:none;cursor:pointer;color:inherit;}
input,select,textarea{font:inherit;color:var(--ink);}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important;}}

/* ---------- login ---------- */
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;
  background:linear-gradient(170deg,#DCE9FC 0%,#E9F1FD 55%,#F7F9FC 100%);z-index:50;}
#login .card{background:#fff;border-radius:32px;box-shadow:var(--shadow-hero);padding:36px 28px;
  width:100%;max-width:400px;text-align:center;}
#login .bear{width:76px;height:76px;border-radius:20px;background:var(--accent-soft);
  display:flex;align-items:center;justify-content:center;font-size:38px;margin:0 auto 16px;}
#login h1{font-size:24px;line-height:32px;font-weight:600;margin-bottom:4px;}
#login .cap{font-size:12px;line-height:16px;color:var(--ink-soft);margin-bottom:22px;}
.choice{display:flex;align-items:center;gap:12px;background:var(--field);border-radius:16px;
  padding:12px 16px;margin-bottom:10px;width:100%;text-align:left;font-size:14px;font-weight:500;
  transition:background .15s cubic-bezier(.4,0,.2,1);}
.choice:hover{background:var(--accent-soft);}
.choice .itile{width:38px;height:38px;border-radius:12px;background:var(--accent-soft);
  color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:16px;flex:none;font-weight:600;}
.choice .sub{display:block;font-size:11px;font-weight:400;color:var(--ink-soft);line-height:15px;}
.choice .itile.unknown{background:#fff;border:2px dashed #8FB0E6;}
#sheet .card .choice{background:#fff;} #sheet .card .choice:hover{background:var(--accent-soft);}

/* ---------- app bar ---------- */
#app{position:fixed;inset:0;display:none;flex-direction:column;}
#appbar{background:#fff;border-bottom:1px solid var(--muted);display:flex;align-items:center;
  gap:10px;padding:10px 16px;flex-wrap:wrap;z-index:20;}
#appbar .bear{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);
  display:flex;align-items:center;justify-content:center;font-size:19px;flex:none;}
#treename{font-weight:600;font-size:16px;white-space:nowrap;max-width:180px;overflow:hidden;text-overflow:ellipsis;}
.iconbtn{width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:var(--primary);
  display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:500;flex:none;}
.chip{background:var(--accent-soft);color:var(--primary);border-radius:999px;padding:7px 14px;
  font-size:13px;font-weight:500;white-space:nowrap;}
#searchwrap{position:relative;flex:1;min-width:130px;max-width:280px;}
#search{width:100%;background:var(--field);border-radius:999px;border:0;outline:0;
  padding:9px 18px;font-size:13px;color:var(--ink);}
#search::placeholder{color:var(--ink-soft);}
#search:focus{box-shadow:0 0 0 2px var(--primary);}
#results{position:absolute;top:42px;left:0;right:0;background:#fff;border-radius:16px;
  box-shadow:var(--shadow-lift);padding:6px;display:none;z-index:40;max-height:260px;overflow:auto;}
#results button{display:flex;width:100%;text-align:left;gap:10px;align-items:center;
  padding:8px 10px;border-radius:12px;font-size:13px;}
#results button:hover{background:var(--field);}
#results .rn{font-weight:500;white-space:nowrap;} #results .rf{font-size:11px;color:var(--ink-soft);}
#results .rn.unknownname{font-weight:400;}
#menuBtn{display:none;}
/* phones: ONE row — 🐻, search, who you're viewing as, ◎ and a ⋯ menu with the rest
   (help, tutorial, keeper settings, rename); pinch zooms, so − / + go too. The search
   results drop down across the whole bar */
@media (max-width:600px){
  #appbar{flex-wrap:nowrap;gap:8px;padding:8px 12px;position:relative;}
  #appbar .bear{width:34px;height:34px;font-size:17px;border-radius:10px;}
  #treename,#renameBtn,#zoomOut,#zoomIn,#tutBtn,#helpBtn,#adminBtn{display:none!important;}
  #menuBtn{display:flex;font-size:18px;}
  #searchwrap{min-width:0;position:static;}
  #viewingBtn{max-width:100px;overflow:hidden;text-overflow:ellipsis;padding:7px 11px;flex:none;}
  #viewingBtn .va,#homeBtn .me{display:none;}
  #homeBtn{padding:7px 11px;flex:none;}
  #results{left:12px;right:12px;top:calc(100% + 4px);}
  #results button{flex-wrap:wrap;row-gap:0;}
}

/* ---------- canvas ---------- */
#viewport{flex:1;position:relative;overflow:hidden;touch-action:none;cursor:grab;}
#viewport.dragging{cursor:grabbing;}
#world{position:absolute;left:0;top:0;transform-origin:0 0;}
#edges{position:absolute;left:0;top:0;pointer-events:none;}
.node{position:absolute;width:120px;text-align:center;cursor:pointer;
  transition:left .55s cubic-bezier(.4,0,.2,1),top .55s cubic-bezier(.4,0,.2,1),
    opacity .45s cubic-bezier(.4,0,.2,1);}
.node.spawn{opacity:0;}
#edges{transition:opacity .3s cubic-bezier(.4,0,.2,1);}
/* --fab (set in applyView) counter-scales the ＋ so it stays a finger-sized 32px on screen
   when the tree is zoomed out; ::after widens the tap target to 44px */
.addfab{position:absolute;top:-10px;left:10px;width:32px;height:32px;border-radius:50%;
  background:var(--primary);color:#fff;font-size:18px;font-weight:500;line-height:1;
  display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-lift);
  opacity:0;transform:scale(calc(var(--fab,1)*.7));transform-origin:100% 100%;pointer-events:none;z-index:3;border:0;cursor:pointer;
  transition:opacity .15s cubic-bezier(.4,0,.2,1),transform .15s cubic-bezier(.4,0,.2,1);}
.addfab::after{content:'';position:absolute;inset:-6px;border-radius:50%;}
.node.selected .addfab{opacity:1;transform:scale(var(--fab,1));pointer-events:auto;}
@media (hover:hover){.node:hover .addfab{opacity:1;transform:scale(var(--fab,1));pointer-events:auto;}}
.avatar{width:64px;height:64px;border-radius:50%;background:var(--accent-soft);color:var(--primary);
  font-weight:600;font-size:18px;position:relative;display:flex;align-items:center;justify-content:center;
  margin:0 auto 6px;box-shadow:var(--shadow-soft);}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.flagpip{position:absolute;top:-4px;right:-4px;width:22px;height:22px;border-radius:50%;background:#fff;
  box-shadow:var(--shadow-soft);font-size:11px;line-height:1;display:flex;align-items:center;justify-content:center;}
.node .nick{font-size:13px;line-height:18px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.node .full{font-size:11px;line-height:15px;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.node .passedon{font-size:10px;line-height:13px;color:var(--ink-soft);margin-top:2px;}
.node.passed .avatar{filter:grayscale(1);opacity:.82;box-shadow:none;outline:1px solid var(--muted);}
.node.passed .nick{color:var(--ink-soft);}
.node.exdim{opacity:.7;} /* married-in ex: still around, visibly not core family */
/* a name still to fill in ("?"): a dashed gap waiting for its name — never the
   greyscale of a memorial or the fade of a married-in ex */
.avatar.unknown{background:#fff;border:2px dashed #8FB0E6;box-shadow:none;color:var(--primary);}
.node.unknown .nick,.node.unknown .full,.unknownname{color:var(--ink-soft);font-style:italic;}
.node .nick.two{white-space:normal;line-height:16px;text-wrap:balance;}
.node.you .avatar{outline:3px solid var(--primary);outline-offset:3px;
  box-shadow:0 0 0 10px rgba(180,206,255,.5),0 10px 30px rgba(0,74,152,.28);}
.youchip{display:inline-block;margin-top:3px;background:var(--primary);color:#fff;border-radius:999px;
  font-size:10px;font-weight:500;padding:2px 10px;}
.xchip{position:absolute;transform:translateX(-50%);background:var(--accent-soft);color:var(--primary);
  border-radius:999px;padding:5px 12px;font-size:11px;font-weight:500;white-space:nowrap;cursor:pointer;
  box-shadow:none;}
.xchip.ghost{background:#fff;outline:1px solid var(--muted);color:var(--ink-soft);}
#focusbar{position:absolute;left:14px;top:12px;display:none;gap:8px;z-index:10;}
#focusbar .on{background:var(--primary);color:#fff;border-radius:999px;padding:7px 14px;font-size:12px;font-weight:500;}
#focusbar .off{background:#fff;color:var(--ink-soft);border-radius:999px;padding:7px 14px;font-size:12px;
  font-weight:500;outline:1px solid var(--muted);}
#navhint{position:absolute;left:16px;bottom:12px;font-size:11px;color:var(--ink-soft);pointer-events:none;}
#minimap{position:absolute;right:14px;bottom:14px;background:#fff;border-radius:12px;
  box-shadow:var(--shadow-soft);width:150px;height:100px;display:none;cursor:pointer;overflow:hidden;}
#minimap .dot{position:absolute;width:7px;height:7px;border-radius:2px;background:var(--muted);}
#minimap .dot.me{background:var(--primary);}
#minimap .vp{position:absolute;border:1.5px solid var(--primary);border-radius:4px;pointer-events:none;}

/* ---------- sheet ---------- */
#scrim{position:fixed;inset:0;background:rgba(26,43,68,.35);display:none;z-index:30;}
#sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);width:100%;max-width:520px;
  background:#fff;border-radius:24px 24px 0 0;box-shadow:var(--shadow-lift);z-index:31;
  max-height:93dvh;overflow-y:auto;padding:10px 20px calc(24px + env(safe-area-inset-bottom));
  transition:transform .25s cubic-bezier(.4,0,.2,1);}
#sheet.open{transform:translate(-50%,0);}
.handle{width:36px;height:4px;border-radius:999px;background:var(--muted);margin:0 auto 16px;}
.profile{display:flex;align-items:center;gap:14px;margin-bottom:16px;}
.profile .avatar{width:76px;height:76px;margin:0;font-size:22px;flex:none;}
.profile h3{font-size:18px;line-height:26px;font-weight:600;}
.cap2{font-size:12px;line-height:17px;color:var(--ink-soft);}
.card{background:var(--field);border-radius:16px;padding:14px 16px;margin-bottom:12px;}
.card .label{font-size:11px;font-weight:500;color:var(--ink-soft);letter-spacing:.06em;
  text-transform:uppercase;margin-bottom:6px;}
.nickrow{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:7px 0;}
.nickrow + .nickrow{border-top:1px solid var(--muted);}
.nickrow .nickname{font-size:15px;font-weight:500;}
.nickrow .who{font-size:12px;color:var(--ink-soft);text-align:right;}
/* a name the family uses that I haven't got one for yet: one tap makes it mine too */
.nickrow.pick{align-items:center;}
.nickrow.pick .who{flex:1;}
.usenick{flex:none;min-height:40px;padding:0 14px;border-radius:999px;background:var(--accent-soft);
  color:var(--primary);font-size:13px;font-weight:500;cursor:pointer;}
/* "Others call them Tomi. You typed Tmoi." — asked before a near-miss is saved */
#nickcheck{margin-top:10px;font-size:14px;line-height:20px;}
#nickcheck .btnrow{margin-top:8px;}
#nickcheck .btn{height:auto;min-height:46px;padding:6px 12px;text-align:center;}
.bignick{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.bignick input{flex:1;background:#fff;border:0;outline:0;border-radius:12px;padding:8px 14px;
  font-size:20px;font-weight:600;color:var(--primary);min-width:0;}
.bignick input:focus{box-shadow:0 0 0 2px var(--primary);}
.onlyus{display:inline-flex;align-items:center;gap:6px;margin:10px 0 2px;font-size:14px;font-weight:500;cursor:pointer;}
.onlyus input{width:18px;height:18px;margin:0;accent-color:var(--primary);}
.node .nick .lock{font-size:9px;margin-left:3px;vertical-align:1px;}
.link{color:var(--primary);font-size:13px;font-weight:500;cursor:pointer;}
.btnrow{display:flex;gap:10px;margin-top:14px;}
.btn{flex:1;height:46px;border-radius:999px;display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:500;transition:background .15s;}
.btn.primary{background:var(--primary);color:#fff;}
.btn.primary:hover{background:var(--primary-hover);}
.btn.secondary{background:var(--accent-soft);color:var(--primary);}
a.btn{text-decoration:none;}
/* an invite's QR code: big, black on white; greyed out once it has run out or been scanned */
.qrbox{width:min(260px,68vw);margin:8px auto 10px;background:#fff;border-radius:16px;padding:6px;}
.qrbox svg{display:block;width:100%;height:auto;transition:opacity .3s,filter .3s;}
.qrbox.dead svg{opacity:.12;filter:grayscale(1) blur(1px);}
/* "Is this you?": a few nodes drawn like the tree, scaled to fit */
.minitree{display:block;width:100%;height:auto;margin:0 auto;overflow:visible;}
.minitree text{text-anchor:middle;font-family:inherit;}
.minitree .fi{font-size:14px;font-weight:600;fill:var(--primary);}
.minitree .fn{font-size:11px;font-weight:500;fill:var(--ink);}
.minitree .fy{font-size:10px;font-weight:500;fill:#fff;}
.qrbox .wait{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--ink-soft);}
.fld{background:var(--field);border-radius:14px;padding:9px 14px;margin-bottom:10px;}
.fld .flabel{display:block;font-size:11px;font-weight:500;color:var(--ink-soft);margin-bottom:1px;}
.fld input,.fld select,.fld textarea{width:100%;background:transparent;border:0;outline:0;font-size:14px;padding:2px 0;}
.fld:focus-within{background:#fff;box-shadow:0 0 0 2px var(--primary);}
/* an iPhone zooms the whole page in when a text box under 16px is tapped, and leaves it
   zoomed — on phones and tablets every box is at least 16px, so typing never moves the page */
@media (pointer: coarse){
  input:not([type=checkbox]):not([type=radio]):not([type=file]),select,textarea{font-size:16px!important;}
  .bignick input{font-size:20px!important;}
}
.fld input:disabled,.fld select:disabled,.fld textarea:disabled{color:var(--ink-soft);}
/* "On the tree: Mei · change" under a name box, and the words to pick from */
.tnline{margin:-4px 0 10px 2px;}
.tnline b{color:var(--ink);font-weight:600;}
.tnline .link{padding:8px 6px;margin:-8px -6px;} /* a finger-sized target, same line height */
.tnpick{margin:-4px 0 10px;padding:10px 12px;background:var(--field);border-radius:14px;}
.wordpick{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 10px;}
.wordpick button{min-height:34px;padding:6px 14px;border-radius:999px;background:#fff;color:var(--primary);
  font-size:14px;font-weight:500;box-shadow:inset 0 0 0 1.5px var(--accent);}
.wordpick button[aria-pressed="true"]{background:var(--primary);color:#fff;box-shadow:none;}
.tnpick .fld{background:#fff;margin-bottom:0;}
.photorow{display:flex;gap:12px;justify-content:space-between;}
.pslot{flex:1;text-align:center;}
.pslot .ph{width:72px;height:72px;border-radius:50%;background:#fff;margin:0 auto 5px;position:relative;
  display:flex;align-items:center;justify-content:center;color:var(--primary);font-size:20px;cursor:pointer;
  box-shadow:var(--shadow-soft);}
.pslot .ph img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.pslot .ph.main{outline:2px solid var(--primary);outline-offset:2px;}
.pslot .pl{font-size:10px;line-height:13px;font-weight:500;color:var(--ink-soft);}
.pslot .star{font-size:11px;color:var(--ink-soft);cursor:pointer;margin-top:2px;display:inline-block;}
.pslot .star.on{color:var(--primary);font-weight:600;}
.grouphdr{font-size:11px;font-weight:500;color:var(--ink-soft);letter-spacing:.06em;text-transform:uppercase;margin:14px 0 6px;}
.viewonly{background:var(--accent-soft);border-radius:12px;padding:8px 14px;font-size:12px;
  color:var(--primary);margin-bottom:12px;}
/* long messages wrap (up to 3 lines) instead of being cut off at phone width */
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,120px);background:var(--ink);color:#fff;
  border-radius:18px;padding:9px 20px;font-size:13px;line-height:19px;font-weight:500;z-index:60;opacity:0;
  transition:all .25s cubic-bezier(.4,0,.2,1);pointer-events:none;width:max-content;max-width:min(88vw,460px);
  text-align:center;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;}
#toast.show{transform:translate(-50%,0);opacity:1;}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;}
.faq{border-top:1px solid var(--muted);padding:10px 0;}
.faq:first-of-type{border-top:0;padding-top:2px;}
.faq .q{display:block;font-size:14px;font-weight:600;margin-bottom:2px;}
.faq p{font-size:13px;line-height:20px;color:var(--ink);}
</style>
</head>
<body>

<div id="login"></div>

<div id="app">
  <div id="appbar">
    <div class="bear">🐻</div>
    <div id="treename" title="tap ✎ to rename">BearFamily</div>
    <button class="iconbtn" id="renameBtn" title="rename your tree">✎</button>
    <div id="searchwrap">
      <input id="search" placeholder="search the family…" autocomplete="off">
      <div id="results"></div>
    </div>
    <button class="chip" id="viewingBtn"><span class="va">viewing as </span>…</button>
    <button class="iconbtn" id="zoomOut">−</button>
    <button class="iconbtn" id="zoomIn">+</button>
    <button class="chip" id="homeBtn" aria-label="back to me">◎<span class="me"> me</span></button>
    <button class="iconbtn" id="tutBtn" title="tutorial">🎓</button>
    <button class="iconbtn" id="helpBtn" title="help" aria-label="help">?</button>
    <button class="iconbtn" id="adminBtn" title="tree keeper settings" aria-label="tree keeper settings" style="display:none;">⭐</button>
    <button class="iconbtn" id="menuBtn" title="more" aria-label="more: help, tutorial, settings">⋯</button>
  </div>
  <div id="viewport">
    <div id="world"><svg id="edges"></svg><div id="nodes"></div></div>
    <div id="focusbar"><span class="on" id="focuslabel"></span><button class="off" id="showall">back to my view</button></div>
    <div id="navhint">click a person for ＋ add · double-click to open · drag to pan · scroll to zoom</div>
    <div id="minimap"></div>
  </div>
</div>

<div id="scrim"></div>
<div id="sheet"><div class="handle"></div><div id="sheetbody"></div></div>
<div id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
<input type="file" id="fileinput" accept="image/*" style="display:none">

<script>
'use strict';
/* Bear Family Tree — cloud build */
// iOS Safari: a pinch on the tree zooms the tree, not the page; everywhere else
// the page zooms as normal, so anyone can make the text bigger
const onTree=e=>!!(e.target&&e.target.closest&&e.target.closest('#viewport'));
document.addEventListener('gesturestart',e=>{ if(onTree(e))e.preventDefault(); });
document.addEventListener('gesturechange',e=>{ if(onTree(e))e.preventDefault(); });
// phones and tablets: one tap opens a person. A mouse keeps click = select, double-click = open
const COARSE=matchMedia('(pointer: coarse)').matches;
/* ================= cloud config ================= */
const SUPABASE_URL='https://garbnserzkuazmvonfem.supabase.co';
const SUPABASE_KEY='sb_publishable_I-mPsmgwDuPqc20Y09iZ7g_lL1Z_sBp';
let sb=null; try{ sb=window.supabase?.createClient(SUPABASE_URL,SUPABASE_KEY,
  {auth:{lock:(_n,_t,fn)=>fn()}}); }catch(e){} // no-op lock: navigator.locks hangs on file:// pages
const APP_URL='https://aizattaha.github.io/bear-family-tree/'; // the family's home — invite links point here
let MODE='demo';                       // 'cloud' after sign-in
let DEMO_CHOSEN=false;                 // "try the local demo" clicked — don't resume a saved sign-in
const ME={userId:null,nucleusId:null,treeId:null,resets:[]};
let PENDING_INVITE=null;               // #invite=CODE in the link → survives the sign-up dance
let PENDING_NEWTREE=null;              // #newtree=CODE → a friend starting their OWN tree (a keeper's one-time code)
try{ const m=location.hash.match(/invite=([A-Za-z0-9]+)/), t=location.hash.match(/newtree(?:=([0-9a-fA-F]{12}))?/);
  if(m)localStorage.setItem('bft.pendingInvite',m[1]);
  if(t)localStorage.setItem('bft.pendingNewTree',t[1]?t[1].toLowerCase():'1'); // '1': an old link without a code
  if(m||/newtree/.test(location.hash))
    try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){}

          if(need>shift)shift=need; } } }
      if(shift<=0)break;
      for(const s of sub)s.x+=dir*shift; } }
  place(mainU,0);
  const roots=units.filter(u=>!u.parent&&!u.placed&&!u.attachedTo);
  const anchorX=r=>{ const au=r.secAnchor.unit;
    return au.members.length>1
      ?(au.members[0]===r.secAnchor.via?au.x-COUPLE/2:au.x+COUPLE/2):au.x; };
  let guard=0;
  while(roots.some(r=>!r.placed)&&guard++<20){
    const ready=roots.filter(r=>!r.placed&&r.secAnchor&&r.secAnchor.unit.placed);
    if(ready.length){ // nearest-to-centre anchors place first, left→right —
      // each side fans outward in kinship order (viewer's maternal side ends
      // by the couple's middle; the partner's side mirrors on the right) and
      // blocks can never leapfrog into each other
      ready.sort((a,b)=>anchorX(a)-anchorX(b));
      // centre each married-in family directly over their own child —
      // never drifting over the child's partner (placeClear slides it
      // aside only if the spot is taken)
      for(const r of ready)placeClear(r,anchorX(r)-width(r)/2,1); }
    else { const r=roots.find(x=>!x.placed);
      const maxX=Math.max(0,...units.filter(u=>u.placed).map(u=>u.x+unitW(u)/2));
      placeClear(r,maxX+120,1); } }
  // ---- per-row de-overlap sweep (residual safety only) ----
  const byRow=new Map();
  for(const u of units){ if(!byRow.has(u.g))byRow.set(u.g,[]); byRow.get(u.g).push(u); }
  for(const row of byRow.values()){ row.sort((a,b)=>a.x-b.x);
    for(let i=1;i<row.length;i++){ const prev=row[i-1],cur=row[i];
      const minX=prev.x+unitW(prev)/2+SIB_GAP+unitW(cur)/2;
      if(cur.x<minX)cur.x=minX; } }
  // ---- emit positions ----
  const genVals=[...new Set(units.map(u=>u.g))].sort((a,b)=>b-a);
  const gmax=genVals[0];
  const pos={}; let minX=Infinity,maxX=-Infinity;
  for(const u of units){ const y=(gmax-u.g)*ROW_H+PAD/2;
    if(u.members.length===1){ pos[u.members[0]]={x:u.x,y}; }
    else { pos[u.members[0]]={x:u.x-COUPLE/2,y}; pos[u.members[1]]={x:u.x+COUPLE/2,y}; }
    minX=Math.min(minX,u.x-unitW(u)/2); maxX=Math.max(maxX,u.x+unitW(u)/2); }
  const off=PAD-minX;
  for(const k in pos)pos[k].x+=off;
  const w=maxX-minX+PAD*2, h=genVals.length*ROW_H+PAD+120;
  layout={pos,gens,bounds:{w:Math.max(w,600),h:Math.max(h,400)},unitOf};
}

const vp=document.getElementById('viewport');
let dragMoved=false, lastPointer='mouse';
(function(){
  const pointers=new Map(); let last=null,pinchD=0;
  vp.addEventListener('pointerdown',e=>{ lastPointer=e.pointerType||'mouse';
    if(e.target.closest('.xchip')||e.target.closest('#focusbar')||e.target.closest('#minimap'))return;
    // NOTE: no setPointerCapture here — capturing on press retargets the
    // click/dblclick to the canvas and node taps never fire. We capture
    // only once a real drag begins (in pointermove).
    pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
    dragMoved=false;
    if(pointers.size===1)last={x:e.clientX,y:e.clientY};
    if(pointers.size===2){ const pts=[...pointers.values()]; pinchD=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y); }
    vp.classList.add('dragging'); });
  vp.addEventListener('pointermove',e=>{ if(!pointers.has(e.pointerId))return;
    pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pointers.size===1&&last){ const dx=e.clientX-last.x,dy=e.clientY-last.y;
      if(!dragMoved&&Math.abs(dx)+Math.abs(dy)>4){ dragMoved=true;
        try{vp.setPointerCapture(e.pointerId);}catch(_){}}
      view.tx+=dx; view.ty+=dy; last={x:e.clientX,y:e.clientY}; applyView(); }
    else if(pointers.size===2){ const pts=[...pointers.values()];
      const d=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y);
      const mid={x:(pts[0].x+pts[1].x)/2,y:(pts[0].y+pts[1].y)/2};
      if(pinchD>0)zoomAt(mid.x,mid.y,d/pinchD);
      pinchD=d;
      if(!dragMoved){ dragMoved=true; try{vp.setPointerCapture(e.pointerId);}catch(_){}} } });
  const up=e=>{ pointers.delete(e.pointerId); last=null; pinchD=0; vp.classList.remove('dragging');
    setTimeout(()=>dragMoved=false,50); };
  vp.addEventListener('pointerup',up); vp.addEventListener('pointercancel',up);
  vp.addEventListener('wheel',e=>{ e.preventDefault();
    if(e.ctrlKey||true){ zoomAt(e.clientX,e.clientY,Math.exp(-e.deltaY*0.0016)); } },{passive:false});

function zoomAt(cx,cy,f){ const r=vp.getBoundingClientRect();

document.getElementById('fileinput').addEventListener('change',e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f||!photoTarget)return;
  const img=new Image(); const url=URL.createObjectURL(f);
  img.onload=async()=>{ const max=384; let w=img.width,h=img.height;
    const sc=Math.min(1,max/Math.max(w,h)); w=Math.round(w*sc);h=Math.round(h*sc);
    const cv=document.createElement('canvas'); cv.width=w;cv.height=h;
    cv.getContext('2d').drawImage(img,0,0,w,h);
    const data=cv.toDataURL('image/jpeg',0.78);
    const pid=photoTarget.pid, per=person(pid);
    const was={photos:{...per.photos},mainPhoto:per.mainPhoto};
    per.photos[photoTarget.slot]=data;
    if(!per.photos[per.mainPhoto])per.mainPhoto=photoTarget.slot;
    save(); rebuild(); openPerson(pid); toast('photo saved'); URL.revokeObjectURL(url);
    if(!await db.savePerson(per)){ per.photos=was.photos; per.mainPhoto=was.mainPhoto; undone(pid); } };
  img.src=url; });

window.saveNick=async(pid,sure)=>{ const v=document.getElementById('mynick').value.trim(), me=viewing();
  const near=!sure&&v&&v!==nickFor(pid)?nearNick(v,pickableNicks(pid)):'';
  if(near){ askNick(pid,v,near); return; }
  const box=document.getElementById('mynick_priv'), priv=!!(v&&box&&box.checked&&pid!==me);
  if(!S.nickPriv)S.nickPriv={};
  const was=(S.nicknames[me]||{})[pid], wasPriv=isPrivNick(me,pid);
  // a background refresh may swap these maps mid-save, so look them up each time
  const put=(t,p)=>{ const n=S.nicknames[me]=S.nicknames[me]||{}, q=S.nickPriv[me]=S.nickPriv[me]||{};
    if(t)n[pid]=t; else delete n[pid];
    if(p)q[pid]=true; else delete q[pid]; };
  put(v,priv);
  save(); rebuild(); refreshViewingBtn(); refreshSheet(pid);
  toast(!v?'nickname removed':pid===me?`saved — you go by ${v}`
    :`saved — you call them ${v}`+(priv?' 🔒 only us':''));
  nickBusy++;
  const ok=await (nickQ=nickQ.then(()=>db.upsertNick(me,pid,v,was!==undefined,priv)));
  nickBusy--;

// a small QR encoder in the page itself, so no outside service ever sees an
// invite code: byte mode, error correction level M, versions 1–10 (up to
// 213 bytes — an invite link is about 60). The steps follow the QR standard
// (ISO/IEC 18004) as laid out in Project Nayuki's MIT-licensed generator.
const QR_ECC=[0,10,16,26,18,24,16,18,22,22,26], QR_BLOCKS=[0,1,1,1,2,2,4,4,4,5,5];
const QR_MASKS=[(x,y)=>(x+y)%2===0,(x,y)=>y%2===0,(x,y)=>x%3===0,(x,y)=>(x+y)%3===0,
  (x,y)=>(Math.floor(x/3)+Math.floor(y/2))%2===0,(x,y)=>x*y%2+x*y%3===0,
  (x,y)=>(x*y%2+x*y%3)%2===0,(x,y)=>((x+y)%2+x*y%3)%2===0];
// → rows of true (dark) / false (light); mask 0–7 forces one (tests), else the best is picked
function qrMatrix(text,forceMask){
  const bytes=[...new TextEncoder().encode(text)];
  const rawMods=v=>{ let r=(16*v+128)*v+64; if(v>=2){ const n=Math.floor(v/7)+2; r-=(25*n-10)*n-55; if(v>=7)r-=36; } return r; };
  const dataCw=v=>Math.floor(rawMods(v)/8)-QR_ECC[v]*QR_BLOCKS[v];
  let ver=1; while(ver<=10&&12+(ver<10?0:8)+8*bytes.length>8*dataCw(ver))ver++;
  if(ver>10)throw new Error('too long for a QR code');
  // the bits: byte mode, length, the bytes, a terminator, then filler bytes
  const bits=[], put=(v,n)=>{ for(let i=n-1;i>=0;i--)bits.push(v>>>i&1); }, cap=8*dataCw(ver);
  put(4,4); put(bytes.length,ver<10?8:16); bytes.forEach(b=>put(b,8));
  put(0,Math.min(4,cap-bits.length)); put(0,(8-bits.length%8)%8);
  for(let f=0xEC;bits.length<cap;f^=0xEC^0x11)put(f,8);
  const cw=[]; for(let i=0;i<bits.length;i+=8)cw.push(bits.slice(i,i+8).reduce((a,b)=>a<<1|b,0));
  // Reed–Solomon error correction for each block, then the blocks interleaved
  const mul=(x,y)=>{ let z=0; for(let i=7;i>=0;i--){ z=(z<<1)^((z>>>7)*0x11D); z^=(y>>>i&1)*x; } return z; };
  const ecLen=QR_ECC[ver], nb=QR_BLOCKS[ver], raw=Math.floor(rawMods(ver)/8);
  const div=Array(ecLen).fill(0); div[ecLen-1]=1;
  for(let i=0,root=1;i<ecLen;i++,root=mul(root,2))
    for(let j=0;j<ecLen;j++){ div[j]=mul(div[j],root); if(j+1<ecLen)div[j]^=div[j+1]; }
  const nShort=nb-raw%nb, shortLen=Math.floor(raw/nb), blocks=[];
  for(let i=0,k=0;i<nb;i++){ const d=cw.slice(k,k+shortLen-ecLen+(i<nShort?0:1)), ec=Array(ecLen).fill(0); k+=d.length;
    d.forEach(b=>{ const f=b^ec.shift(); ec.push(0); div.forEach((c,j)=>{ ec[j]^=mul(c,f); }); });
    if(i<nShort)d.push(0); blocks.push(d.concat(ec)); }
  const all=[]; for(let i=0;i<blocks[0].length;i++)blocks.forEach((b,j)=>{ if(i!==shortLen-ecLen||j>=nShort)all.push(b[i]); });
  // the fixed parts: timing lines, the three corner squares, alignment squares, format + version
  const size=ver*4+17, mod=[...Array(size)].map(()=>Array(size).fill(false)), fixed=mod.map(r=>r.slice());
  const set=(x,y,dark)=>{ mod[y][x]=dark; fixed[y][x]=true; };
  for(let i=0;i<size;i++){ set(6,i,i%2===0); set(i,6,i%2===0); }
  [[3,3],[size-4,3],[3,size-4]].forEach(([cx,cy])=>{ for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){
    const x=cx+dx, y=cy+dy, d=Math.max(Math.abs(dx),Math.abs(dy)); if(x>=0&&x<size&&y>=0&&y<size)set(x,y,d!==2&&d!==4); } });
  if(ver>1){ const n=Math.floor(ver/7)+2, step=Math.ceil((ver*4+4)/(n*2-2))*2, pos=[6];

async function newQr(){ const q=QR; if(!q)return; clearInterval(q.tick);

  let res; try{ res=await withTimeout(sb.rpc('make_qr_invite',{p:q.pid,invite_nm:q.nm})); }catch(e){ res={error:e}; }
  if(QR!==q){ if(res.data)dropQr(res.data.code); return; } // the sheet closed meanwhile

function qrTick(q){ if(QR!==q)return clearInterval(q.tick);

    if(el)el.textContent=t; else qrShow(false,`works for <b id="qr_left" aria-hidden="true">${t}</b> · they open their phone's camera and point it here`);

// every few seconds: has it been scanned — or used to take their place?
async function qrCheck(q){ const code=q.code; if(!code)return;
  const r=await sb.from('tree_invite').select('opened_at,expires_at,used_at,declined_at').eq('code',code).maybeSingle().then(x=>x,e=>({error:e}));
  if(QR!==q||q.code!==code||r.error)return;
  const done=()=>{ clearInterval(q.tick); q.code=null; };
  // used invites stay on record now: the row says what happened. Until keepers confirm a
  // scan, the one-tap undo is right here: "that wasn't them" releases the claim at once
  if(r.data&&r.data.used_at){ done(); qrShow(true,`🎉 ${esc(q.nm)} has taken their place on the tree<br>
      <button class="link" id="qr_undo">↩ that wasn't ${esc(q.nm)}? undo — release this claim</button>`);
    document.getElementById('ln_card').remove(); scheduleRefetch();
    document.getElementById('qr_undo').onclick=()=>qrUndo(q); return; }
  if(r.data&&r.data.declined_at){ done();
    qrShow(true,`🚫 whoever scanned it said <b>this isn't them</b>, so the code is cancelled — tap refresh to make one for ${esc(q.nm)}`,true); return; }
  if(!r.data){ done(); qrShow(true,'this code was deleted — tap refresh for a new one',true); return; }
  if(!r.data.opened_at)return;
  const until=new Date(r.data.expires_at);
  if(until<=new Date()){ done(); qrShow(true,`${esc(q.nm)} didn't finish signing up in time — tap refresh for a new code`,true); return; }
  if(q.opened)return;
  q.opened=true; clearInterval(q.tick); q.n=1; q.tick=setInterval(()=>qrTick(q),1000);
  qrShow(true,`✓ scanned — ${esc(q.nm)} has ${minsLeft(until)} minutes to finish signing up, until <b>${esc(timeOf(until))}</b><br>
    <button class="link" id="qr_cancel">not ${esc(q.nm)}? cancel this code</button>`);
  document.getElementById('qr_cancel').onclick=async()=>{
    if(!confirm(`Cancel this code? Whoever scanned it can't use it to take ${q.nm}'s place any more.`))return;
    const d=await dropQr(code,true); if(QR!==q)return;
    if(d.error){ dbErr(d.error); return; }

async function qrUndo(q){ const b=document.getElementById('qr_undo'); if(!b)return;

function revealPath(target){ let vis=computeVisible(); if(vis.has(target))return;
  // BFS path from viewer to target over the full graph
  const prev={}; const seen=new Set([viewing()]); let front=[viewing()];
  outer: while(front.length){ const nxt=[];
    for(const f of front) for(const n of neighborsOf(f)) if(!seen.has(n)){
      seen.add(n); prev[n]=f; nxt.push(n); if(n===target)break outer; }
    front=nxt; }
  if(!(target in prev))return;
  const path=[target]; let c=target; while(prev[c]){c=prev[c];path.unshift(c);}
  for(let i=0;i<path.length-1;i++){ const A=path[i],B=path[i+1];
    vis=computeVisible(); if(vis.has(B))continue;
    if(parentsOf(A).includes(B)||siblingsOf(A).includes(B))addExpansionSilent('side',A);
    else addExpansionSilent('family',A); }
  save(); rebuild(); updateFocusBar(displayName(target)); }
function addExpansionSilent(kind,pid){ computeVisible(); const key=kind+':'+pid;
  let e=S.history.find(x=>expKey(x)===key);
  if(!e){e={kind,pid,from:revealedBy.get(pid)||'nucleus'};S.history.push(e);}
  if(kind==='side'){ const partnerSides=partnersOf(pid).map(x=>'side:'+x);
    S.active=S.active.filter(k=>!partnerSides.includes(k)); }
  if(!S.active.includes(key))S.active.push(key); }

    return `<button class="choice" data-n="${n.id}"><span class="itile">${esc((n.label[0]||'?').toUpperCase())}</span>
      <span>${esc(n.label)}<span class="sub">${esc(mem.map(goesBy).join(', ')||'no members yet')} · "${esc(n.treeName)}"</span></span></button>`; }).join('');
  loginCard(`<h1>Local demo</h1>
    <div class="cap">pick a household — data stays in this browser only</div>
    ${houses}`);
  el.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{
    const nid=b.dataset.n; const mems=nucleusMembers(nid);
    if(!mems.length){toast('that household has no members yet');return;}
    if(mems.length===1)startSession(nid,mems[0]);
    else pickProfile(nid,mems); }); }
async function enterCloud(){ MODE='cloud'; S=blankState();
  loginCard('<h1>Bear Family Tree</h1><div class="cap">loading your tree…</div>');
  let user=null;
  try{ const {data,error}=await withTimeout(sb.auth.getUser());
    if(error&&isNetErr(error))throw error; user=data&&data.user; }
  catch(e){ renderOffline(enterCloud); return; }
  if(!user){ MODE='demo'; renderLogin(false,'','please sign in again'); return; }
  ME.userId=user.id;
  let ok; try{ ok=await cloudFetchAll(); }
  catch(e){ if(isNetErr(e)){ renderOffline(enterCloud); return; }
    loginCard(`<h1>hmm</h1><div class="cap">couldn't load your tree — ${esc((e&&e.message)||e)}</div>
    <button class="btn secondary" style="width:100%;" onclick="location.reload()">try again</button>`); return; }
  if(!ok){ if(PENDING_INVITE){ renderJoinInvited(PENDING_INVITE); return; }
    if(PENDING_NEWTREE){ renderStartTree(); return; }
    renderOnboarding(); return; }
  if(PENDING_INVITE){ try{localStorage.removeItem('bft.pendingInvite');}catch(e){}
    PENDING_INVITE=null; toast('invite ignored — you already have a place in this tree'); }
  if(PENDING_NEWTREE){ try{localStorage.removeItem('bft.pendingNewTree');}catch(e){} PENDING_NEWTREE=null; }
  const members=nucleusMembers(ME.nucleusId);
  if(!members.length){ renderWhoAreYou(); return; }
  let prefs=null; try{ prefs=JSON.parse(localStorage.getItem('bft.prefs.'+ME.userId)); }catch(e){}
  if(prefs&&prefs.session&&members.includes(prefs.session.viewingAs)){
    S.session={nucleusId:ME.nucleusId,viewingAs:prefs.session.viewingAs};
    S.history=prefs.history||[]; S.active=prefs.active||[];
    ensureDefaults(); enterApp(); }
  else if(members.length===1)startSession(ME.nucleusId,members[0]);
  else pickProfile(ME.nucleusId,members); }
function renderOnboarding(){
  loginCard(`<h1>Welcome 🐻</h1>
    <div class="cap">set up your place in the family</div>
    <button class="choice" id="ob_new"><span class="itile">🌱</span>
      <span>Start a new family tree<span class="sub">with a start-a-tree link from a tree keeper</span></span></button>
    <button class="choice" id="ob_join"><span class="itile">✉</span>
      <span>Join with an invite code<span class="sub">someone in the family sent you a code</span></span></button>
    <button class="link" id="ob_out" style="margin-top:12px;">sign out</button>`);
  document.getElementById('ob_out').onclick=signOut;
  document.getElementById('ob_new').onclick=renderStartTree;
  document.getElementById('ob_join').onclick=()=>{
    loginCard(`<h1>Join the family</h1>
      <div class="fld" style="text-align:left;"><span class="flabel">Invite code</span><input id="ob_code" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
      <div class="cap">your household is named after you, so the tree keepers can tell everyone apart</div>
      <div id="ob_msg" class="cap" style="min-height:18px;" role="status" aria-live="polite"></div>
      <button class="btn primary" style="width:100%;" id="ob_go">Join</button>`);
    document.getElementById('ob_go').onclick=async()=>{
      const code=document.getElementById('ob_code').value.trim();
      if(!code){document.getElementById('ob_msg').textContent='the invite code is needed';return;}
      document.getElementById('ob_msg').textContent='joining…';
      // no names to type: the database names the household after its first member
      // and gives it the tree keepers' name for the tree
      const {data,error}=await sb.rpc('join_with_invite',{invite_code:code,nucleus_label:'',tree_nm:''});
      if(error){document.getElementById('ob_msg').textContent=(error.message||'failed').toLowerCase();return;}
      await cloudFetchAll();
      if(data&&data.person_id)startSession(data.nucleus_id,data.person_id);
      else renderWhoAreYou(); }; }; }
// a new tree needs a keeper's one-time code: from the #newtree= link, or pasted here
const startCodeOf=s=>{ const m=String(s||'').match(/(?:newtree=)?([0-9a-f]{12})\b/i); return m?m[1].toLowerCase():''; };
function renderStartTree(){ const pending=startCodeOf(PENDING_NEWTREE);
  loginCard(`<h1>Start your tree</h1>
    <div class="cap">you'll be its first tree keeper ⭐ — you look after its invites</div>
    <div class="fld" style="text-align:left;"><span class="flabel">Your full name</span><input id="ob_name"></div>
    <div class="fld" style="text-align:left;"><span class="flabel">Gender</span>
      <select id="ob_gender"><option value="">—</option><option value="m">man</option><option value="f">woman</option></select></div>
    <div class="fld" style="text-align:left;"><span class="flabel">Name of your tree — you can change it later</span><input id="ob_tree" value="Our family"></div>
    ${pending?'':`<div class="fld" style="text-align:left;"><span class="flabel">Start-a-tree link or code, from a tree keeper</span><input id="ob_start" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="paste the link they sent you"></div>`}
    <div id="ob_msg" class="cap" style="min-height:18px;" role="status" aria-live="polite"></div>
    <button class="btn primary" style="width:100%;" id="ob_go">Create</button>
    <button class="link" id="ob_out2" style="margin-top:12px;">sign out</button>`);
  document.getElementById('ob_out2').onclick=signOut;
  document.getElementById('ob_go').onclick=async()=>{
    const name=document.getElementById('ob_name').value.trim();
    const tn=document.getElementById('ob_tree').value.trim();
    const start=pending||startCodeOf((document.getElementById('ob_start')||{}).value);
    if(!name){document.getElementById('ob_msg').textContent='your name is needed';return;}
    if(!start){document.getElementById('ob_msg').textContent='a new tree needs the start-a-tree link a tree keeper sent you — paste it in the last box';return;}
    document.getElementById('ob_msg').textContent='creating…';
    // the household is named after you once you're on the tree ("Aizat's household")
    const {error}=await sb.rpc('create_tree',{nucleus_label:'',tree_nm:tn,start_code:start});
    if(error){document.getElementById('ob_msg').textContent=(error.message||'failed').toLowerCase();return;}
    await cloudFetchAll();
    const id=crypto.randomUUID();
    const {error:e2}=await sb.from('person').insert({id,tree_id:ME.treeId,full_name:name,
      gender:document.getElementById('ob_gender').value||null,claimed_by:ME.nucleusId});
    if(e2){document.getElementById('ob_msg').textContent=(e2.message||'failed').toLowerCase();return;}
    try{localStorage.removeItem('bft.pendingNewTree');}catch(e){} PENDING_NEWTREE=null;
    await cloudFetchAll(); startSession(ME.nucleusId,id); }; }
function renderJoinInvited(code){
  loginCard(`<h1>Welcome 🐻</h1>
    <div class="cap">you've been invited — one tap and you're in your place on the tree</div>
    <div id="ji_note" class="cap" style="color:var(--primary);font-weight:500;"></div>
    <div class="cap">your household is named after you, so the tree keepers can tell everyone apart</div>
    <div id="ji_msg" class="cap" style="min-height:18px;" role="status" aria-live="polite"></div>
    <button class="btn primary" style="width:100%;" id="ji_go">Take my place</button>
    <button class="link" id="ji_out" style="margin-top:12px;">sign out</button>`);
  openInvite().then(inv=>{ const n=document.getElementById('ji_note'); if(n&&inv!==undefined)n.innerHTML=inviteNote(inv,false); });
  document.getElementById('ji_out').onclick=signOut;
  document.getElementById('ji_go').onclick=async()=>{
    document.getElementById('ji_msg').textContent='joining…';
    const {data,error}=await sb.rpc('join_with_invite',{invite_code:code,nucleus_label:'',tree_nm:''});
    if(error){ document.getElementById('ji_msg').textContent=/invalid or expired/.test(error.message||'')?inviteNote(null)
      :(error.message||'failed').toLowerCase(); return; }
    try{localStorage.removeItem('bft.pendingInvite');}catch(e){} PENDING_INVITE=null;
    await cloudFetchAll();
    if(data&&data.person_id)startSession(data.nucleus_id,data.person_id);
    else renderWhoAreYou(); }; }
function renderWhoAreYou(){
  // someone still called "?" is shown as "Ali's wife", after everyone with a name
  const unclaimed=Object.values(S.persons).filter(p=>!p.claimedBy)
    .sort((a,b)=>isPlaceholder(a.id)-isPlaceholder(b.id));
  loginCard(`<h1>Who are you?</h1>
    <div class="cap">claim yourself if family already added you — or add yourself fresh</div>
    <div style="max-height:220px;overflow:auto;">
      ${unclaimed.map(p=>{ const ph=isPlaceholder(p.id);
        return `<button class="choice" data-claim="${p.id}"><span class="itile${ph?' unknown':''}">${esc(initials(p))}</span>
        <span${ph?' class="unknownname"':''}>${esc(fullName(p.id))}<span class="sub">${ph?'name not known yet':p.born?('b. '+esc(p.born)):'unclaimed'}</span></span></button>`; }).join('')||'<div class="cap">nobody unclaimed yet</div>'}
    </div>
    <div class="fld" style="text-align:left;margin-top:10px;"><span class="flabel">or add yourself — full name</span><input id="wa_name"></div>
    <button class="btn primary" style="width:100%;" id="wa_new">Add me</button>`);
  document.querySelectorAll('[data-claim]').forEach(b=>b.onclick=async()=>{
    const pid=b.dataset.claim; if(!claimOk(fullName(pid)))return;
    const {error}=await sb.rpc('claim_person',{p:pid});
    if(error){toast((error.message||'claim failed').toLowerCase());return;}
    S.persons[pid].claimedBy=ME.nucleusId; startSession(ME.nucleusId,pid); });
  document.getElementById('wa_new').onclick=async()=>{
    const name=document.getElementById('wa_name').value.trim();
    if(!name){toast('your name is needed');return;}
    const id=crypto.randomUUID();
    const {error}=await sb.from('person').insert({id,tree_id:ME.treeId,full_name:name,claimed_by:ME.nucleusId});
    if(error){toast((error.message||'failed').toLowerCase());return;}
    await cloudFetchAll(); startSession(ME.nucleusId,id); }; }
function pickProfile(nid,mems){ const el=document.getElementById('login');
  el.querySelector('.card').innerHTML=`<div class="bear">🐻</div>
    <h1>Who's looking?</h1><div class="cap">nicknames are personal — pick yourself</div>
    ${mems.map(m=>`<button class="choice" data-p="${m}"><span class="itile">${esc(initials(person(m)))}</span>
      <span>${esc(fullName(m))}</span></button>`).join('')}`;
  el.querySelectorAll('.choice').forEach(b=>b.onclick=()=>startSession(nid,b.dataset.p)); }
function startSession(nid,pid){ S.session={nucleusId:nid,viewingAs:pid};
  S.history=[];S.active=[]; ensureDefaults(); save(); enterApp(); }
document.getElementById('viewingBtn').onclick=()=>{
  const mems=nucleusMembers(S.session.nucleusId);
  if(mems.length<2){toast('only you on this login');return;}
  const i=(mems.indexOf(viewing())+1)%mems.length;
  S.session.viewingAs=mems[i]; S.history=[];S.active=[]; ensureDefaults(); save();
  refreshViewingBtn();
  closeSheet(); rebuild(); centerOn(viewing()); lastFocusLabel=''; updateFocusBar();
  toast('viewing as '+goesBy(viewing())); };

/* ================= boot ================= */
function enterApp(){
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='flex';
  document.getElementById('treename').textContent=S.nuclei[S.session.nucleusId].treeName;
  refreshViewingBtn();
  rebuild(); view.s=1; centerOn(viewing()); updateFocusBar();
  if(MODE==='cloud'){ subscribeRealtime(); stampSeen(); }
  document.getElementById('adminBtn').style.display=isSuper()?'flex':'none';
  const tutorial=()=>{ try{ if(!localStorage.getItem(tutKey()))setTimeout(()=>openTutorial(true),600); }catch(e){} };
  // something to tell them first (a password reset, a declined invite)? the tutorial waits for next time
  if(MODE==='cloud')cloudNotices().then(shown=>{ if(!shown)tutorial(); }); else tutorial(); }
// told once on this device: "your password was reset by a tree keeper" (a reset done on another
// phone — maybe not by them), and, for keepers, invites someone said "not me" to
const declineKey=()=>'bft.declineSeen.'+ME.userId;
async function cloudNotices(){ const notes=[], seenD=[];
  try{ const {data,error}=await withTimeout(sb.rpc('my_password_resets')); if(error)throw error;
    ME.resets=Array.isArray(data)?data:[];
    const seen=seenResets();
    ME.resets.filter(x=>!seen.includes(String(x.id))).forEach(x=>{ const at=new Date(x.at);
      notes.push({reset:String(x.id),html:`<div class="card"><div class="label">🔑 Your password was reset</div>
        <p style="font-size:14px;line-height:21px;">A tree keeper from <b>${esc(x.by)}</b> made a reset code for this login, and it was used on ${esc(dayOf(at))} at ${esc(timeOf(at))}.</p>
        <div class="cap2" style="margin-top:6px;">If that was you asking for help, all is well. If not, tell the family straight away — another keeper can help you back in.</div></div>`}); }); }
  catch(e){ ME.resets=ME.resets||[]; }
  if(isSuper()) try{ const since=new Date(Date.now()-14*864e5).toISOString();
    const {data,error}=await withTimeout(sb.from('tree_invite').select('code,invite_name,kind,declined_at,person_id').not('declined_at','is',null).gt('declined_at',since));
    if(error)throw error;
    let seen=[]; try{ seen=JSON.parse(localStorage.getItem(declineKey())||'[]'); }catch(e){}
    // (once that person has joined anyway, there's nothing left to do)
    (data||[]).filter(i=>!seen.includes(i.code)&&!(i.person_id&&S.persons[i.person_id]&&S.persons[i.person_id].claimedBy)).forEach(i=>{ const at=new Date(i.declined_at), nm=i.invite_name||'a relative';
      seenD.push(i.code);
      notes.push({html:`<div class="card"><div class="label">🚫 Invite cancelled — "not me"</div>
        <p style="font-size:14px;line-height:21px;">Someone opened the ${i.kind==='qr'?'QR code':'link'} for <b>${esc(nm)}</b> and said it isn't them, so it was cancelled on ${esc(dayOf(at))} at ${esc(timeOf(at))}.</p>
        <div class="cap2" style="margin-top:6px;">If ${esc(nm)} still needs one, open their card and make a new invite — and send it to them only, never to a group.</div></div>`}); }); }
  catch(e){}
  if(!notes.length||sheet.classList.contains('open'))return false;
  openSheet(`${notes.map(n=>n.html).join('')}<div class="btnrow"><button class="btn primary" id="nt_ok">OK</button></div>`);
  document.getElementById('nt_ok').onclick=()=>{ markResetSeen(notes.filter(n=>n.reset).map(n=>n.reset));
    try{ localStorage.setItem(declineKey(),JSON.stringify([...JSON.parse(localStorage.getItem(declineKey())||'[]'),...seenD].slice(-100))); }catch(e){}
    closeSheet(); };
  return true; }
const IDLE_DAYS=30;                     // signed out after this many quiet days (Aizat's call — change the number)
const IDLE_MS=IDLE_DAYS*24*60*60*1000;
function stampSeen(){ if(MODE==='cloud'&&ME.userId)
  try{ localStorage.setItem('bft.lastSeen.'+ME.userId,String(Date.now())); }catch(e){} }
async function boot(){ S=blankState();
  if(sb)sb.auth.onAuthStateChange(ev=>{
    if(ev==='SIGNED_OUT'&&MODE==='cloud'){ // the sign-in ended elsewhere (expired, revoked, password reset)
      MODE='demo'; renderLogin(false,'','you were signed out — please sign in again'); } });
  renderLogin(); // always paint immediately — never gate first paint on the network
  if(sb){ try{ const {data,error}=await Promise.race([ sb.auth.getSession(),
      new Promise(res=>setTimeout(()=>res({data:{session:null}}),4000)) ]);
    if(error&&isNetErr(error)&&!DEMO_CHOSEN&&MODE!=='cloud'){ renderOffline(); return; }
    // resume the saved sign-in, unless someone already chose the demo or signed in by hand
    if(data&&data.session&&!DEMO_CHOSEN&&MODE!=='cloud'){
      const uid=data.session.user&&data.session.user.id;
      let last=0; try{ last=parseInt(localStorage.getItem('bft.lastSeen.'+uid)||'0',10); }catch(e){}
      if(uid&&last&&Date.now()-last>IDLE_MS){ // away too long — sign out
        try{ localStorage.removeItem('bft.lastSeen.'+uid); await sb.auth.signOut(); }catch(e){}
        renderLogin(); toast("signed out — it's been a while since your last visit 🐻",4000);
        return; }
      enterCloud(); } }catch(e){} } }
boot();
window.addEventListener('resize',()=>drawMinimap());
</script>
